<!-- Add Expense -->
{% extends "base.html" %}

{% block title %}Add Expense - Raasu{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-file-earmark-plus"></i> Record Expense / Withdrawal</h5>
                <a href="{{ url_for('expenses.index') }}" class="btn btn-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> Back to Expenses
                </a>
            </div>
            <div class="card-body">
                <form method="POST" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="beneficiary_name" class="form-label">Beneficiary Name *</label>
                            <input type="text" class="form-control" id="beneficiary_name" name="beneficiary_name"
                                   value="{{ beneficiary_name or request.form.beneficiary_name }}" required>
                            <div class="invalid-feedback">Enter the beneficiary or payee name.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="expense_date" class="form-label">Expense Date *</label>
                            <input type="date" class="form-control" id="expense_date" name="expense_date"
                                   value="{{ expense_date or request.form.expense_date or datetime.now().strftime('%Y-%m-%d') }}" required>
                            <div class="invalid-feedback">Choose the expense date.</div>
                        </div>
                    </div>

                    <div class="row g-3 mt-3">
                        <div class="col-md-4">
                            <label for="transaction_type" class="form-label">Entry Type *</label>
                            <select class="form-select" id="transaction_type" name="transaction_type" required>
                                <option value="expense" {% if (transaction_type or request.form.transaction_type or 'expense') == 'expense' %}selected{% endif %}>Expense / Withdrawal</option>
                               <!-- <option value="return" {% if (transaction_type or request.form.transaction_type) == 'return' %}selected{% endif %}>Return / Reversal</option>-->
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="amount" class="form-label">Amount (₦) *</label>
                            <div class="input-group">
                                <span class="input-group-text">₦</span>
                                <input type="number" step="0.01" min="0" class="form-control" id="amount" name="amount"
                                       value="{{ amount or request.form.amount }}" required>
                            </div>
                            <div class="invalid-feedback">Enter a valid amount greater than zero.</div>
                        </div>
                        <div class="col-md-4">
                            <label for="beneficiary_address" class="form-label">Beneficiary Address</label>
                            <input type="text" class="form-control" id="beneficiary_address" name="beneficiary_address"
                                   value="{{ beneficiary_address or request.form.beneficiary_address }}">
                        </div>
                    </div>

                    <div class="mt-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4"
                                  placeholder="Details about the expense">{{ description or request.form.description }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Save Expense
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';
    const forms = document.querySelectorAll('form');
    Array.prototype.slice.call(forms).forEach(function (form) {
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    });
})();
</script>
{% endblock %}
