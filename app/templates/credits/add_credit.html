<!-- Add Credit -->
{% extends "base.html" %}

{% block title %}Add Credit - Raasu{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-person-plus"></i> Add Customer Credit</h5>
                <a href="{{ url_for('credits.index_credits') }}" class="btn btn-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </div>
            <div class="card-body">
                <form method="POST" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="customer_name" class="form-label">Customer Name *</label>
                            <input type="text" class="form-control" id="customer_name" name="customer_name"
                                   value="{{ customer_name or request.form.customer_name }}" required>
                            <div class="invalid-feedback">Enter the customer's name.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="customer_contact" class="form-label">Contact</label>
                            <input type="text" class="form-control" id="customer_contact" name="customer_contact"
                                   value="{{ customer_contact or request.form.customer_contact }}">
                        </div>
                    </div>

                    <div class="row g-3 mt-3">
                        <div class="col-md-6">
                            <label for="total_credit" class="form-label">Credit Amount (₦) *</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="total_credit" name="total_credit"
                                   value="{{ total_credit or request.form.total_credit }}" required>
                            <div class="invalid-feedback">Enter the amount of credit to record.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="transaction_date" class="form-label">Credit Date *</label>
                            <input type="date" class="form-control" id="transaction_date" name="transaction_date"
                                   value="{{ request.form.transaction_date or datetime.now().strftime('%Y-%m-%d') }}" required>
                            <div class="invalid-feedback">Select the credit date.</div>
                        </div>
                    </div>

                    <div class="mt-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3"
                                  placeholder="Optional details">{{ description or request.form.description }}</textarea>
                    </div>

                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Save Credit
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';
    const forms = document.querySelectorAll('form');
    Array.prototype.slice.call(forms).forEach(function (form) {
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    });
})();
</script>
{% endblock %}
