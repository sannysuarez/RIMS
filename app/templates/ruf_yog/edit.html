<!-- Edit Ruf-Yog Product -->
{% extends "base.html" %}

{% block title %}Edit Ruf-Yog Product{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1>Edit Ruf-Yog Product</h1>
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted">Product ID</label>
                        <p class="form-text">{{ product.unique_id }}</p>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Product Name *</label>
                        <input type="text" class="form-control" id="name" name="name" 
                               value="{{ product.name }}" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="cost_per_unit" class="form-label">Cost Per Unit (₦) *</label>
                            <div class="input-group">
                                <span class="input-group-text">₦</span>
                                <input type="number" step="0.01" class="form-control" id="cost_per_unit" 
                                       name="cost_per_unit" value="{{ product.cost_per_unit }}" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="sell_price_per_unit" class="form-label">Sell Price Per Unit (₦) *</label>
                            <div class="input-group">
                                <span class="input-group-text">₦</span>
                                <input type="number" step="0.01" class="form-control" id="sell_price_per_unit" 
                                       name="sell_price_per_unit" value="{{ product.sell_price_per_unit }}" required>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Update Product
                        </button>
                        <a href="{{ url_for('ruf_yog.view_product', product_id=product.id) }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
