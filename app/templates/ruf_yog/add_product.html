<!-- Add Ruf-Yog Product -->
{% extends "base.html" %}

{% block title %}Add Ruf-Yog Product{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1>Add Ruf-Yog Product</h1>
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="product_name" class="form-label">Product Name *</label>
                        <input type="text" class="form-control" id="product_name" name="product_name" 
                               value="{{ product_name or '' }}" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="cost_per_unit" class="form-label">Cost Per Unit (₦) *</label>
                            <div class="input-group">
                                <span class="input-group-text">₦</span>
                                <input type="number" step="0.01" class="form-control" id="cost_per_unit" 
                                       name="cost_per_unit" value="{{ cost_per_unit or '' }}" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="sell_price_per_unit" class="form-label">Sell Price Per Unit (₦) *</label>
                            <div class="input-group">
                                <span class="input-group-text">₦</span>
                                <input type="number" step="0.01" class="form-control" id="sell_price_per_unit" 
                                       name="sell_price_per_unit" value="{{ sell_price_per_unit or '' }}" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="quantity" class="form-label">Initial Quantity (pieces) *</label>
                        <input type="number" class="form-control" id="quantity" name="quantity" 
                               value="{{ quantity or '' }}" min="1" step="1" required>
                        <small class="form-text text-muted">Must be a positive whole number</small>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Add Product
                        </button>
                        <a href="{{ url_for('ruf_yog.products') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
