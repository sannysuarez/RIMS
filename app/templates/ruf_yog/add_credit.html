<!-- Add Ruf-Yog Credit -->
{% extends "base.html" %}

{% block title %}Add Ruf-Yog Credit{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1>Add Customer Credit</h1>
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="customer_name" class="form-label">Customer Name *</label>
                        <input type="text" class="form-control" id="customer_name" name="customer_name" 
                               value="{{ customer_name or '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="customer_contact" class="form-label">Customer Contact</label>
                        <input type="tel" class="form-control" id="customer_contact" name="customer_contact" 
                               value="{{ customer_contact or '' }}">
                    </div>

                    <div class="mb-3">
                        <label for="total_credit" class="form-label">Credit Amount (₦) *</label>
                        <div class="input-group">
                            <span class="input-group-text">₦</span>
                            <input type="number" step="0.01" class="form-control" id="total_credit" name="total_credit" 
                                   value="{{ total_credit or '' }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ description or '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="transaction_date" class="form-label">Credit Date *</label>
                        <input type="datetime-local" class="form-control" id="transaction_date" name="transaction_date" 
                               value="{{ transaction_date or '' }}" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Save Credit
                        </button>
                        <a href="{{ url_for('ruf_yog.credits') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
