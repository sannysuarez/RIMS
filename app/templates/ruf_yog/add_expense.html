<!-- Add Ruf-Yog Expense -->
{% extends "base.html" %}

{% block title %}Add Ruf-Yog Expense{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1>Add Ruf-Yog Expense</h1>
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="beneficiary_name" class="form-label">Beneficiary Name *</label>
                        <input type="text" class="form-control" id="beneficiary_name" name="beneficiary_name" 
                               value="{{ beneficiary_name or '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ description or '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount (₦) *</label>
                        <div class="input-group">
                            <span class="input-group-text">₦</span>
                            <input type="number" step="0.01" class="form-control" id="amount" name="amount" 
                                   value="{{ amount or '' }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="expense_date" class="form-label">Expense Date *</label>
                        <input type="datetime-local" class="form-control" id="expense_date" name="expense_date" 
                               value="{{ expense_date or '' }}" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Save Expense
                        </button>
                        <a href="{{ url_for('ruf_yog.expenses') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
