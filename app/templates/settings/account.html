{% extends "base.html" %}

{% block title %}Account Settings - Shop Ceramics{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h1 class="h4 mb-0">Account Settings</h1>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Name</label>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            value="{{ username if username is defined else current_user.username }}"
                            maxlength="80"
                            required
                        >
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            value="{{ email if email is defined else current_user.email }}"
                            maxlength="120"
                            required
                        >
                    </div>
                    <div class="mb-4">
                        <label for="phone_number" class="form-label">Phone number</label>
                        <input
                            type="tel"
                            class="form-control"
                            id="phone_number"
                            name="phone_number"
                            value="{{ phone_number if phone_number is defined else (current_user.phone_number or '') }}"
                            autocomplete="tel"
                            required
                        >
                        <div class="form-text">with or without country code</div>
                    </div>

                    <h2 class="h5">Change Password</h2>
                    <p class="text-muted">Leave these fields blank to keep your current password.</p>
                    <div class="mb-3">
                        <label for="current_password" class="form-label">Current password</label>
                        <input type="password" class="form-control" id="current_password" name="current_password" autocomplete="current-password">
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">New password</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" minlength="8" autocomplete="new-password">
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Confirm new password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
